<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>photo-tidy</title>
<style>
  /* 라이트박스 톤: 사진이 주인공 — 짙은 무채색 바탕, 조용한 조작부, 상태는 색 하나로 (남김 초록 · 후보 빨강 · 추천 금색) */
  :root {
    --bg:#0b0b0d; --s1:#151518; --s2:#1e1e22; --s3:#2a2a30; --line:#2a2a30;
    --text:#f2f2f4; --dim:#8c8c96; --faint:#5c5c66;
    --accent:#3d8bff; --keep:#34c759; --drop:#ff453a; --star:#ffcc00;
    --r:12px; --shadow:0 10px 40px #000c;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
         font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  ::selection { background:var(--accent); }

  /* ── 상단 바 ── */
  header { position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:14px; padding:10px 18px;
           background:rgba(13,13,16,.78); backdrop-filter:saturate(1.4) blur(16px); -webkit-backdrop-filter:saturate(1.4) blur(16px);
           border-bottom:1px solid #ffffff12; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; letter-spacing:-.2px; white-space:nowrap; }
  .brand i { width:22px; height:22px; border-radius:7px; background:conic-gradient(from 210deg, var(--keep), var(--accent), var(--star), var(--keep)); display:inline-block; }
  nav { display:flex; gap:2px; padding:3px; background:var(--s1); border:1px solid var(--line); border-radius:11px; overflow-x:auto; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { background:transparent; color:var(--dim); border-radius:8px; padding:6px 12px; white-space:nowrap; }
  nav button:hover { background:var(--s2); color:var(--text); }
  nav button.on { background:var(--s3); color:var(--text); box-shadow:inset 0 0 0 1px #ffffff14; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:8px; }
  #stats { color:var(--dim); font-size:12.5px; white-space:nowrap; }

  /* ── 버튼 ── */
  button { font:inherit; color:var(--text); background:var(--s2); border:1px solid transparent; border-radius:10px; padding:7px 13px; cursor:pointer;
           transition:background .15s, border-color .15s, transform .08s; }
  button:hover { background:var(--s3); }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.45; cursor:default; transform:none; }
  button.primary { background:var(--accent); color:#fff; font-weight:600; }
  button.primary:hover { background:#5a9cff; }
  button.danger { background:#ff453a1f; color:#ff7a70; border-color:#ff453a55; }
  button.danger:hover { background:#ff453a33; }
  button.icon { width:34px; height:34px; padding:0; display:grid; place-items:center; font-size:16px; }
  kbd { font:11px ui-monospace, Menlo, monospace; background:#ffffff14; border:1px solid #ffffff1c; border-bottom-width:2px; border-radius:5px; padding:0 5px; margin:0 1px; }
  button.primary kbd { background:#ffffff26; border-color:#ffffff33; }

  /* ── 본문 ── */
  main { padding:18px 18px 28px; max-width:1680px; margin:0 auto; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .bar .info { color:var(--dim); margin-right:auto; display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 10px; }
  .hint { color:var(--faint); font-size:12.5px; margin:0 0 12px; }
  .empty { color:var(--dim); padding:80px 20px; text-align:center; font-size:15px; }

  /* 묶음 제목 */
  .gnum { color:var(--text); font-size:22px; font-weight:700; letter-spacing:-.4px; }
  .gof { color:var(--faint); font-size:15px; font-weight:600; }
  .meta { color:var(--dim); }
  .pill { display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:99px; }
  .pill.k { color:var(--keep); background:#34c7591f; }
  .pill.d { color:#ff7a70; background:#ff453a1f; }
  .progress { height:3px; background:var(--s2); border-radius:9px; overflow:hidden; margin:-4px 0 14px; }
  .progress i { display:block; height:100%; background:linear-gradient(90deg, var(--keep), var(--accent)); border-radius:9px; transition:width .4s; }

  /* ── 사진 칸 ── */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:10px; }
  .tile { position:relative; aspect-ratio:1; background:var(--s1); border-radius:var(--r); overflow:hidden; cursor:pointer;
          box-shadow:0 0 0 1px #ffffff0d; transition:box-shadow .15s, transform .15s; -webkit-touch-callout:none; user-select:none; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition:filter .2s, transform .3s; }
  @media (hover:hover) { .tile:hover img { transform:scale(1.035); } }
  .tile .lbl { position:absolute; left:0; right:0; bottom:0; padding:18px 8px 6px; font-size:11.5px; font-weight:600; color:#fff;
               background:linear-gradient(transparent, #000d); text-shadow:0 1px 2px #000; }
  .tile .badge { position:absolute; top:7px; right:7px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center;
                 font-size:13px; font-weight:800; }
  .tile.keep { box-shadow:0 0 0 3px var(--keep); }
  .tile.keep .badge { background:var(--keep); color:#06210f; }
  .tile.keep .badge::after { content:"✓"; }
  .tile.drop { box-shadow:0 0 0 2px #ff453acc; }  /* 후보도 원래 색 그대로 — 직접 비교할 수 있게 (흑백은 확인이 어려움) */
  .tile.drop img { filter:brightness(.8); }
  .tile.drop .badge { background:var(--drop); color:#fff; box-shadow:0 2px 8px #0008; }
  .tile.drop .badge::after { content:"✕"; }
  .tile.cur { box-shadow:0 0 0 3px var(--accent), 0 0 0 6px #3d8bff40; }
  .tile.keep.cur { box-shadow:0 0 0 3px var(--keep), 0 0 0 6px #3d8bff66; }
  .tile .star { position:absolute; top:7px; left:7px; font-size:11px; font-weight:700; color:#2a2100; background:var(--star);
                padding:2px 7px; border-radius:99px; box-shadow:0 2px 8px #0008; }
  .tile .star::after { content:" 추천"; }
  .tile.cand img { filter:brightness(.5); }
  .tile.cand::after { content:"🗑 후보"; position:absolute; top:7px; left:7px; font-size:11px; font-weight:600; background:#000c; padding:3px 8px; border-radius:99px; }
  .tile .undo { position:absolute; right:7px; top:7px; z-index:2; font-size:15px; padding:5px 11px; background:#000c; border-radius:99px; border:1px solid #ffffff2a; }

  /* 영상: 장면 미리보기를 가로로 펼친 줄 */
  .vrow { display:flex; gap:14px; align-items:center; padding:10px; margin-bottom:8px; background:var(--s1); border:1px solid var(--line);
          border-radius:var(--r); cursor:pointer; transition:background .15s, box-shadow .15s; }
  .vrow:hover { background:var(--s2); }
  .vrow.sel { box-shadow:0 0 0 2px #ff453acc; background:#ff453a14; }
  .vrow.cand { opacity:.45; }
  .vinfo { width:150px; flex:none; }
  .vinfo b { display:block; font-size:19px; letter-spacing:-.3px; }
  .vinfo span { display:block; color:var(--dim); font-size:12px; }
  .vinfo .vstate { margin-top:8px; font-weight:600; color:var(--faint); }
  .vrow.sel .vstate { color:#ff7a70; }
  .vstrip { flex:1; display:flex; gap:4px; height:118px; overflow:hidden; border-radius:8px; position:relative; }
  .vstrip img { height:100%; width:auto; flex:none; border-radius:6px; -webkit-touch-callout:none; user-select:none; }
  .vstrip .nof { position:absolute; left:8px; bottom:6px; font-size:11px; color:var(--dim); background:#000b; padding:2px 7px; border-radius:99px; }

  /* 위치·여행·용량 */
  .rows { background:var(--s1); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .rows div.row { display:flex; gap:12px; padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .rows div.row:last-child { border-bottom:0; }
  .rows div.row:hover, .rows div.row.on { background:var(--s2); }
  .rows .grow { flex:1; }
  .rows .dim { color:var(--dim); }
  .years { display:flex; gap:8px; align-items:flex-end; height:96px; margin-bottom:22px; padding:0 2px; }
  .years div { flex:0 1 56px; background:linear-gradient(180deg, var(--accent), #3d8bff55); border-radius:6px 6px 2px 2px; position:relative; min-height:3px; }
  .years span { position:absolute; bottom:-19px; left:0; right:0; text-align:center; font-size:11px; color:var(--dim); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; margin-bottom:18px; }
  .card { background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; cursor:pointer; transition:border-color .15s, background .15s; }
  .card:hover { background:var(--s2); }
  .card.on { border-color:var(--accent); box-shadow:0 0 0 3px #3d8bff33; }
  .card b { display:block; font-size:15px; margin-bottom:4px; }
  .card span { color:var(--dim); font-size:12px; }
  .month { margin:22px 0 10px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:10px; position:sticky; top:56px; z-index:2;
           padding:6px 0; background:linear-gradient(var(--bg) 70%, transparent); }
  .month button { font-size:12px; font-weight:500; padding:4px 10px; }
  .chips { gap:6px; }
  .chips button { white-space:nowrap; border-radius:99px; padding:6px 13px; background:var(--s1); border-color:var(--line); color:var(--dim); }
  .chips button.on { background:var(--text); color:#111; border-color:var(--text); font-weight:600; }

  /* ── 알림 ── */
  #err, #okmsg { display:none; position:fixed; bottom:156px; left:50%; transform:translateX(-50%); z-index:20; max-width:min(680px, 92vw);
                 padding:10px 16px; border-radius:12px; font-weight:500; box-shadow:var(--shadow); }
  #err { background:#3a1311; color:#ffb3ad; border:1px solid #ff453a66; }
  #okmsg { background:#0f2a17; color:#b7f5c8; border:1px solid #34c75966; }
  #undo { display:none; position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:8; background:#232327ee;
          backdrop-filter:blur(12px); border:1px solid #ffffff1a; border-radius:14px; padding:9px 10px 9px 16px; gap:14px; align-items:center; box-shadow:var(--shadow); }
  #undo.show { display:flex; }

  /* ── 하단 고정 바 (태블릿 묶음 · 📷 전체) ── */
  .gbar { position:fixed; left:0; right:0; bottom:0; z-index:4; display:flex; gap:8px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
          background:rgba(13,13,16,.82); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid #ffffff12; }
  .gbar button { flex:1; font-size:16px; padding:13px 0; border-radius:12px; }
  .gbar button.primary { flex:2; }

  /* ── 크게 보기 ── */
  #pv { display:none; position:fixed; inset:0; z-index:10; background:#050507ee; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
        flex-direction:column; align-items:center; justify-content:center; touch-action:none; }
  #pv.open { display:flex; animation:fade .14s ease-out; }
  @keyframes fade { from { opacity:0 } }
  #pv img, .tile img { -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
  #pv img { max-width:94vw; max-height:80vh; object-fit:contain; border-radius:10px; box-shadow:0 20px 60px #000; outline:3px solid transparent; outline-offset:4px; }
  #pv img.keep { outline-color:var(--keep); }
  #pv img.drop { outline-color:var(--drop); }
  #pv video { display:none; max-width:94vw; max-height:76vh; border-radius:10px; background:#000; box-shadow:0 20px 60px #000; }
  #pv.video video { display:block; }
  #pv.video img { display:none; }
  #pv .cap { margin-top:14px; color:var(--dim); text-align:center; padding:0 16px; }
  #pv .cap b { color:var(--text); }
  .pvbar { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .pvbar button { min-width:56px; font-size:16px; padding:10px 16px; border-radius:99px; background:#ffffff14; border-color:#ffffff1a; }
  .pvbar button:hover { background:#ffffff22; }
  .pvbar button.danger { background:#ff453a26; }
  #view { touch-action:pan-y; }  /* 세로 스크롤은 브라우저, 가로 밀기는 묶음 이동 */

  /* ── ⚙️ 설정 ── */
  #st { display:none; position:fixed; top:62px; right:16px; z-index:9; width:360px; max-height:calc(100vh - 80px); overflow:auto; background:#1a1a1eee;
        backdrop-filter:blur(16px); border:1px solid #ffffff1a; border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); }
  #st.open { display:block; animation:fade .14s ease-out; }
  #st h3 { margin:0 0 4px; font-size:15px; }
  #st .sec { color:var(--faint); font-size:11.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; margin:16px 0 4px; }
  #st label { display:block; margin:10px 0; }
  #st .row { display:flex; justify-content:space-between; font-size:13px; }
  #st .row b { color:var(--accent); }
  #st input[type=range] { width:100%; accent-color:var(--accent); }
  #st .help { color:var(--faint); font-size:11.5px; }
  #st .res { margin-top:12px; padding:10px; background:var(--s1); border-radius:10px; text-align:center; }

  /* ── 기기별 ── */
  @media (pointer: coarse) {  /* 태블릿·폰: 손가락으로 누르기 쉽게 */
    button { padding:11px 16px; font-size:15px; }
    nav button { padding:9px 14px; }
    .grid { grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px; }
    .key { display:none; }
    main { padding-bottom:100px; }
    #stats { display:none; }
  }
  @media (pointer: fine) { .touch { display:none; } }
  @media (max-width: 900px) { .brand span { display:none; } header { gap:10px; padding:8px 12px; } main { padding:14px 12px 100px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i><span>photo-tidy</span></div>
  <nav>
    <button data-tab="groups">비슷한 묶음</button>
    <button data-tab="all">전체</button>
    <button data-tab="videos">영상</button>
    <button data-tab="size">용량</button>
    <button data-tab="places">위치</button>
    <button data-tab="trips">여행</button>
    <button data-tab="cands">후보</button>
  </nav>
  <div class="tools">
    <span id="stats"></span>
    <button id="delbtn" class="danger" style="display:none"></button>
    <button id="reloadbtn" class="icon" title="Photos 라이브러리 다시 읽기 (새로 찍은 사진·다른 기기에서 지운 사진 반영)">⟳</button>
    <button id="stbtn" class="icon" title="추출 파라미터">⚙︎</button>
  </div>
</header>
<div id="err"></div>
<div id="okmsg"></div>
<main id="view"></main>
<div id="undo"></div>
<div id="pv"><img alt="" draggable="false"><video controls playsinline preload="auto"></video><div class="cap"></div>
  <div class="pvbar"><button data-a="prev">◀</button><button data-a="keep">✓ / ✕</button><button data-a="next">▶</button><button data-a="play" style="display:none">▶ 재생</button><button data-a="cand" class="danger">🗑 후보로</button><button data-a="close">닫기</button></div>
</div>
<div id="st"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const fmt = b => b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b >= 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.round(b / 1e3) + " KB";
const day = iso => iso.slice(0, 10);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const banner = (id, msg) => { const e = $(id); e.textContent = msg; e.style.display = msg ? "block" : "none"; };
const showErr = msg => banner("#err", msg);
const showOk = msg => { banner("#okmsg", msg); if (msg) setTimeout(() => banner("#okmsg", ""), 6000); };
const api = async (path, opts) => {
  const r = await fetch("/api/" + path, opts);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
};
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

function tile(uuid, label = "", cls = "", star = false, title = "") {
  if (current === "all" && CAND.has(uuid)) cls += " cand";  // 전체 탭: ✕(선택)와 구분
  else if (!["groups", "cands", "all"].includes(current) && CAND.has(uuid)) cls += " drop";  // 다른 탭: 삭제 후보에 넣은 사진은 ✕
  return `<div class="tile ${cls}" data-uuid="${esc(uuid)}" title="${esc(title)}">` +
    `<img loading="lazy" src="/thumb/${encodeURIComponent(uuid)}" onerror="this.remove()">` +
    (star ? `<span class="star">★</span>` : "") + `<span class="badge"></span>` +
    (label ? `<span class="lbl">${esc(label)}</span>` : "") + `</div>`;
}
const thumbs = uuids => uuids.length
  ? `<div class="grid">${uuids.slice(0, 300).map(u => tile(u)).join("")}</div>` +
    (uuids.length > 300 ? `<p class="empty">… 외 ${uuids.length - 300}장</p>` : "")
  : `<p class="empty">사진 없음</p>`;

async function refreshStats() {
  const s = await api("summary");
  $("#stats").textContent = `사진 ${s.count.toLocaleString()}장 · ${fmt(s.size)} · 영상 ${s.movies} · 남은 묶음 ${s.groups}` +
    (s.deleted_bytes ? ` · 정리 ${fmt(s.deleted_bytes)}` : "");
}

// ── 삭제 후보 → 실제 삭제 ─────────────────────
let CAND = new Set();  // 삭제 후보 앨범에 들어 있는 사진
async function refreshCandidates() {
  try {
    const c = await api("candidates");
    CAND = new Set(c.uuids);
    $("nav [data-tab=cands]").textContent = c.count ? `후보 ${c.count.toLocaleString()}` : "후보";
    const b = $("#delbtn");
    b.style.display = c.count ? "" : "none";
    b.textContent = `🗑 삭제 후보 ${c.count}장 삭제 (${fmt(c.size)})`;
  } catch (e) { /* 앨범 조회 실패는 버튼만 숨김 */ $("#delbtn").style.display = "none"; }
}
$("#delbtn").onclick = async () => {
  const remote = !["localhost", "127.0.0.1"].includes(location.hostname);
  if (!confirm("'photo-tidy 삭제 후보' 앨범의 사진을 삭제합니다.\n" +
    (remote ? "⚠️ 확인 창은 Mac 화면에 뜹니다 — Mac에서 승인해야 삭제됩니다.\n" : "다음에 뜨는 macOS 확인 창에서 한 번 더 승인해야 삭제됩니다.\n") +
    "삭제된 사진은 Photos '최근 삭제된 항목'에서 30일 동안 복구할 수 있습니다.\n" +
    "※ iCloud 공간은 '최근 삭제된 항목'을 비워야 바로 생깁니다 (안 비우면 30일 뒤 자동).")) return;
  const b = $("#delbtn"); b.disabled = true; b.textContent = "macOS 확인 창을 기다리는 중…";
  try {
    const r = await post("delete", {});
    showErr(""); showOk(r.deleted ? `${r.deleted}장 · ${fmt(r.bytes)} 삭제됨 — 공간을 바로 확보하려면 Photos › 최근 삭제된 항목 › 모두 삭제 (안 하면 30일 뒤 자동)` : "삭제된 사진 없음 (취소했거나 후보가 비어 있음)");
    await Promise.all([refreshStats(), refreshCandidates()]);
    if (current !== "groups") openTab(current);
  } catch (e) {
    showErr("삭제 실패: " + e.message);
  } finally { b.disabled = false; refreshCandidates(); }
};

// ── 크게 보기 (Space) ───────────────────────
// list: uuid 배열, i: 위치, keepSet: 묶음 탭이면 남김 집합(X로 전환), 아니면 null
const PV = { open: false, list: [], i: 0, keepSet: null, onMove: null };
// 고화질은 서버 대기열이 헬퍼 1개로 iCloud에서 받아옴 (로컬엔 480px뿐).
// 나중에 보낸 요청이 맨 앞 → 지금 보는 사진이 항상 1순위. 중복·이미 받은 것은 서버가 거름.
const prefetch = uuids => { if (uuids.length) post("prefetch", { uuids }).catch(() => {}); };
function pvRender() {
  const u = PV.list[PV.i], img = $("#pv img");
  let tries = 0;
  pvVideo(u);
  prefetch([u]);  // 지금 보는 사진을 대기열 맨 앞으로
  img.onload = () => {  // 아직 저화질이면 0.5초 뒤 다시 (고화질 도착하면 바로 교체, 최대 ~90초)
    if (!PV.movie && img.naturalWidth < 700 && img.naturalHeight < 700 && tries++ < 180)  // 영상은 장면 미리보기를 덮지 않게
      setTimeout(() => { if (PV.open && !PV.movie && PV.list[PV.i] === u) img.src = `/preview/${encodeURIComponent(u)}?r=${Date.now()}`; }, 500);
  };
  img.src = "/preview/" + encodeURIComponent(u);
  img.className = PV.keepSet ? (PV.keepSet.has(u) ? "keep" : "drop") : "";
  pvCaption();
  for (const d of [-1, 1]) { const n = PV.list[PV.i + d]; if (n) new Image().src = "/preview/" + encodeURIComponent(n); }  // 이웃 미리 로드
}
// 영상: 열면 Photos가 로컬에 둔 장면 미리보기(8장)를 바로 순환. ▶ 재생은 iCloud 원본을 받아야 해서(4K 몇 분,
// 그동안 사진 데몬이 막혀 사진 고화질도 느려짐) 버튼을 눌렀을 때만. 원본이 이미 Mac에 있으면 서버가 바로 준비.
let VS = "", SB = null;  // 영상 상태 문구, 장면 미리보기 타이머
const stopStoryboard = () => { clearInterval(SB); SB = null; };
function pvVideo(u, start = false) {
  const box = $("#pv"), v = $("#pv video"), img = $("#pv img"), play = $("#pv [data-a=play]");
  if (!start) {
    box.classList.remove("video"); v.pause(); v.removeAttribute("src");
    VS = ""; PV.movie = false; play.style.display = "none"; stopStoryboard();
  }
  if (PV.keepSet) return;  // 비슷한 묶음은 사진만
  const check = async st => {
    if (!PV.open || PV.list[PV.i] !== u) return;
    try {
      const r = await post("video", { uuid: u, start: st });
      if (!PV.open || PV.list[PV.i] !== u || r.status === "not_video") return;
      PV.movie = true;
      if (r.frames && !SB && !box.classList.contains("video")) {
        let i = 0;
        img.src = `/frame/${encodeURIComponent(u)}/0`;
        SB = setInterval(() => { i = (i + 1) % r.frames; img.src = `/frame/${encodeURIComponent(u)}/${i}`; }, 700);
      }
      play.style.display = r.status === "none" || r.status.startsWith("failed") ? "" : "none";
      if (r.status === "ready") {
        stopStoryboard(); VS = "";
        v.src = "/video/" + encodeURIComponent(u); box.classList.add("video"); v.play().catch(() => {});
      } else if (r.status === "working") {
        VS = r.local ? " · 🎬 재생 준비 중…" : " · 🎬 iCloud에서 원본 받는 중… (4K는 몇 분 — 다른 사진 보다 와도 됨)";
        setTimeout(() => check(false), 3000);
      } else if (r.status === "none") {
        VS = r.frames ? ` · 🎬 장면 미리보기 ${r.frames}장 (▶ 재생 = iCloud 원본 받기, 몇 분)` : " · 🎬 ▶ 재생 = iCloud 원본 받기 (몇 분)";
      } else VS = " · 🎬 실패: " + r.status.replace(/^failed: /, "");
    } catch (e) { VS = " · 🎬 오류: " + e.message; }
    pvCaption();
  };
  check(start);
}
function pvCaption() {
  const u = PV.list[PV.i];
  const state = PV.keepSet ? (PV.keepSet.has(u) ? " · <b style='color:var(--keep)'>남김 ✓</b>" : " · <b style='color:var(--drop)'>삭제 후보 ✕</b>") : "";
  const gp = PV.keepSet && G.list[G.i] ? G.list[G.i].photos.find(p => p.uuid === u) : null;
  const score = gp ? ` · ${esc(scoreLabel(gp))}${gp.uuid === G.list[G.i].best ? " ★" : ""}` : "";
  $("#pv [data-a=keep]").style.display = PV.keepSet ? "" : "none";
  const cb = $("#pv [data-a=cand]");
  cb.style.display = PV.keepSet ? "none" : "";
  cb.textContent = CAND.has(u) ? "↩ 후보에서 빼기" : "🗑 후보로";
  $("#pv .cap").innerHTML = `<b>${PV.i + 1}</b> / ${PV.list.length}${state}${score}${esc(VS)}` +
    (!PV.keepSet && CAND.has(u) ? " · <b style='color:var(--drop)'>삭제 후보 ✕</b>" : "") +
    ` <span class="key">&nbsp; <kbd>←</kbd><kbd>→</kbd> 이동` +
    (PV.keepSet ? ` · <kbd>X</kbd> 남김/후보` : "") + ` · <kbd>Space</kbd>/<kbd>Esc</kbd> 닫기</span>`;
}
async function removeCandidate(u) {  // 후보 취소 (앨범에서만 빠지고 사진은 그대로)
  try {
    await post("uncandidate", { uuids: [u] });
    CAND.delete(u);
    view.querySelectorAll(`.tile[data-uuid="${CSS.escape(u)}"]`).forEach(t => current === "cands" ? t.remove() : t.classList.remove("drop", "cand"));
    view.querySelectorAll(`.vrow[data-uuid="${CSS.escape(u)}"]`).forEach(r => { r.classList.remove("cand"); r.querySelector(".vstate").textContent = "탭해서 선택"; });
    pvCaption(); refreshCandidates(); showOk("후보에서 뺐어요 (사진은 그대로)");
  } catch (e) { showErr("후보 빼기 실패: " + e.message); }
}
async function addCandidate(u) {  // 묶음 밖 사진·영상을 삭제 후보 앨범으로
  try {
    await post("candidate", { uuids: [u] });
    CAND.add(u);
    view.querySelectorAll(`.tile[data-uuid="${CSS.escape(u)}"]`).forEach(t => t.classList.add(current === "all" ? "cand" : "drop"));
    view.querySelectorAll(`.vrow[data-uuid="${CSS.escape(u)}"]`).forEach(r => { r.classList.remove("sel"); r.classList.add("cand"); r.querySelector(".vstate").textContent = "🗑 후보"; V.sel.delete(u); updateVSel(); });
    pvCaption(); refreshCandidates();
  } catch (e) { showErr("후보 추가 실패: " + e.message); }
}
function pvOpen(list, i, keepSet = null, onMove = null) {
  if (!list.length) return;
  Object.assign(PV, { open: true, list, i, keepSet, onMove });
  prefetch(list.slice(i, i + 30).concat(list.slice(Math.max(0, i - 10), i)));  // 다음 사진 우선
  $("#pv").classList.add("open"); pvRender();
}
function pvClose() {
  PV.open = false;
  const v = $("#pv video"); v.pause(); v.removeAttribute("src"); v.load(); stopStoryboard();
  $("#pv").classList.remove("open", "video"); $("#pv img").src = "";
}
function pvMove(d) {
  PV.i = Math.max(0, Math.min(PV.list.length - 1, PV.i + d));
  if (PV.onMove) PV.onMove(PV.i);
  pvRender();
}
// 크게 보기 터치: 좌우 스와이프로 넘기기, 하단 버튼, 배경 탭으로 닫기
let swipe = null;
$("#pv").onpointerdown = e => { swipe = e.target.tagName === "VIDEO" ? null : { x: e.clientX, y: e.clientY }; };  // 재생바 끌기는 넘기기 아님
$("#pv").onpointerup = e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { pvMove(dx < 0 ? 1 : -1); PV.swipedAt = Date.now(); }
};
$("#pv").onclick = e => {
  if (Date.now() - (PV.swipedAt || 0) < 400) return;  // 스와이프 끝에 오는 click 무시 (안 올 수도 있어 시각으로)
  const a = e.target.dataset.a;
  if (a === "prev") pvMove(-1);
  else if (a === "next") pvMove(1);
  else if (a === "keep" && PV.keepSet) toggleKeep(PV.list[PV.i]);
  else if (a === "cand" && !PV.keepSet) (CAND.has(PV.list[PV.i]) ? removeCandidate : addCandidate)(PV.list[PV.i]);
  else if (e.target.tagName === "IMG" && PV.keepSet) toggleKeep(PV.list[PV.i]);  // 묶음: 사진 탭 = 남김/후보
  else if (a === "play") pvVideo(PV.list[PV.i], true);
  else if (a === "close" || e.target.id === "pv") pvClose();
};

// 다른 탭: 마우스 올린 사진에서 Space → 그 그리드 전체를 넘겨보기
let hoverTile = null;
document.addEventListener("mouseover", e => { hoverTile = e.target.closest(".tile"); });
function pvFromTile(tile) {
  if (!tile) return false;
  const tiles = [...tile.closest(".grid").querySelectorAll(".tile")];
  pvOpen(tiles.map(t => t.dataset.uuid), tiles.indexOf(tile));
  return true;
}
const pvFromHover = () => pvFromTile(hoverTile);

// 터치: 사진 길게 누르기(0.45초) = 크게 보기. 그 뒤 따라오는 click(남김/후보 전환)은 무시
// 길게 누르기·밀기 뒤에 오는 click은 무시 — 터치 브라우저는 이때 click을 안 보내기도 해서
// "다음 click 1번 무시" 플래그는 그다음 정상 탭을 먹어 버림 → 손 뗀 직후 0.4초만 무시
let press = null, suppressUntil = 0;
document.addEventListener("pointerdown", e => {
  const tile = e.target.closest(".grid .tile");
  if (!tile || e.pointerType === "mouse" || e.target.closest(".undo")) return;
  press = { tile, x: e.clientX, y: e.clientY, fired: false, timer: setTimeout(() => {
    press.fired = true;
    if (current === "groups") {
      setCursor([...view.querySelectorAll(".grid .tile")].indexOf(tile));
      openGroupPreview();
    } else pvFromTile(tile);
  }, 450) };
});
const cancelPress = e => {
  if (!press) return;
  if (e.type === "pointermove" && Math.hypot(e.clientX - press.x, e.clientY - press.y) <= 10) return;
  if (press.fired && e.type === "pointerup") suppressUntil = Date.now() + 400;
  clearTimeout(press.timer); press = null;
};
["pointerup", "pointercancel", "pointermove"].forEach(ev => document.addEventListener(ev, cancelPress));
// 묶음 화면 좌우로 밀기 = 이전/다음 묶음 (태블릿)
let gswipe = null;
view.addEventListener("pointerdown", e => { gswipe = current === "groups" && e.pointerType !== "mouse" ? { x: e.clientX, y: e.clientY } : null; });
view.addEventListener("pointerup", e => {
  if (!gswipe || PV.open) return;
  const dx = e.clientX - gswipe.x, dy = e.clientY - gswipe.y;
  gswipe = null;
  if (Math.abs(dx) > 80 && Math.abs(dx) > 2 * Math.abs(dy)) { suppressUntil = Date.now() + 400; move(dx < 0 ? 1 : -1); }
});
document.addEventListener("click", e => {
  if (Date.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); return; }
  if (!["groups", "all"].includes(current) && !e.target.closest(".undo")) pvFromTile(e.target.closest(".grid .tile"));  // 다른 탭: 탭 = 크게 보기
}, true);
// 길게 누르기 = 크게 보기인데, 손가락이 그대로 있으면 Chrome이 새로 뜬 크게 보기 이미지에 이미지 메뉴(저장 등)를 띄움
// → 사진 칸뿐 아니라 크게 보기 화면 전체에서 막음 (영상은 브라우저 재생 조작 때문에 예외)
document.addEventListener("contextmenu", e => {
  if (e.target.closest(".tile, #pv") && e.target.tagName !== "VIDEO") e.preventDefault();
});

// ── 비슷한 묶음 ─────────────────────────────
const G = { list: [], i: 0, cur: 0, keep: new Set(), done: 0, start: 0 };  // done/start = 이번 세션 진행률
const resetKeep = () => { G.cur = 0; G.keep = new Set(G.list.length ? [G.list[G.i].best] : []); };

function setCursor(i) {
  const tiles = view.querySelectorAll(".grid .tile");
  if (!tiles.length) return;
  G.cur = Math.max(0, Math.min(tiles.length - 1, i));
  tiles.forEach((t, k) => t.classList.toggle("cur", k === G.cur));
  tiles[G.cur].scrollIntoView({ block: "nearest" });
}

function toggleKeep(u) {
  G.keep.has(u) ? G.keep.delete(u) : G.keep.add(u);
  renderGroup();
  if (PV.open) pvRender();
}

function renderGroup() {
  if (!G.list.length) { view.innerHTML = `<p class="empty">정리할 묶음이 없습니다 🎉</p>`; return; }
  const g = G.list[G.i];
  const drop = g.photos.filter(p => !G.keep.has(p.uuid));
  const when = g.photos[0].date.replace("T", " ").slice(0, 16);
  view.innerHTML = `
    <div class="bar">
      <span class="info"><span class="gnum">묶음 ${G.i + 1}</span><span class="gof">/ ${G.list.length.toLocaleString()}</span>
        <span class="meta">${esc(when)}${g.photos[0].city ? " · " + esc(g.photos[0].city) : ""} · ${g.photos.length}장</span>
        <span class="pill k">✓ 남김 ${G.keep.size}</span><span class="pill d">✕ 후보 ${drop.length} · ${fmt(drop.reduce((a, p) => a + p.size, 0))}</span></span>
      <button id="prev" title="이전 묶음 (↑)">↑</button>
      <button id="keepall">전부 남기기</button>
      <button id="ok" class="primary">확정 <kbd>Enter</kbd></button>
      <button id="next" title="다음 묶음 (↓)">↓</button>
    </div>
    <div class="progress" title="이번에 정리한 묶음 ${G.done} / ${G.start}"><i style="width:${G.start ? (100 * G.done / G.start).toFixed(1) : 0}%"></i></div>
    <p class="hint">★ 추천 = ${g.people ? "얼굴(품질·눈 뜸·웃음) 65% + Apple 사진 점수 35%" : "Apple 사진 점수(초점·조명·구도)"} · ♥ 즐겨찾기 우선 · 😑 눈 감음 · 😊 웃음</p>
    <p class="hint touch">사진 탭 = 남김✓·후보✕ · 길게 누르기 = 크게 보기(사진 탭 = 남김/후보, 좌우로 밀어 넘기기) · 화면을 좌우로 밀면 이전/다음 묶음</p>
    <p class="hint key"><kbd>←</kbd><kbd>→</kbd> 사진 이동 · <kbd>Space</kbd> 크게 보기 · <kbd>X</kbd>/클릭 남김✓·후보✕ · <kbd>Enter</kbd> 확정 · <kbd>↑</kbd><kbd>↓</kbd> 묶음 이동</p>
    <div class="grid">${g.photos.map(p =>
      tile(p.uuid, scoreLabel(p), G.keep.has(p.uuid) ? "keep" : "drop", p.uuid === g.best, scoreTitle(p))).join("")}</div>
    <div class="gbar touch"><button data-g="prev">◀</button><button data-g="keepall">전부 남기기</button>
      <button data-g="ok" class="primary">확정 ✓ (✕ ${drop.length}장)</button><button data-g="next">▶</button></div>`;
  view.querySelectorAll("[data-g]").forEach(b => b.onclick = () =>
    ({ prev: () => move(-1), next: () => move(1), ok: confirmGroup, keepall: () => $("#keepall").click() })[b.dataset.g]());
  view.querySelectorAll(".grid .tile").forEach((t, k) => {
    t.onclick = () => { setCursor(k); toggleKeep(t.dataset.uuid); };
    t.onmouseenter = () => setCursor(k);
  });
  setCursor(G.cur);
  $("#prev").onclick = () => move(-1);
  $("#next").onclick = () => move(1);
  $("#ok").onclick = confirmGroup;
  $("#keepall").onclick = () => { G.keep = new Set(g.photos.map(p => p.uuid)); confirmGroup(); };
}

const scoreLabel = p => `${Math.round(p.rank * 100)}점 · ${fmt(p.size)}` +
  (p.favorite ? " ♥" : "") + (p.eyes_closed ? " 😑" : "") + (p.smile ? " 😊" : "");
const scoreTitle = p => `Apple 사진 점수 ${p.score}` +
  (p.face === null ? " · 얼굴 없음" : ` · 얼굴 ${p.face}${p.eyes_closed ? " (눈 감음)" : ""}${p.smile ? " (웃음)" : ""}`);

function openGroupPreview() {
  const g = G.list[G.i];
  if (g) pvOpen(g.photos.map(p => p.uuid), G.cur, G.keep, i => setCursor(i));
}

// 앞으로 볼 사진 고화질 미리 받기: 지금 묶음 → 다음 묶음들 순서로 최대 300장. 묶음이 바뀔 때마다 갱신
// (서버 대기열은 나중 요청이 맨 앞이라 지금 묶음이 항상 1순위, 다 본 묶음은 서버가 캐시·대기열에서 뺌)
const LOOKAHEAD = 300;  // 다운로드 한계 ~1장/초 → 약 5분치 여유분, 다 본 묶음은 서버가 캐시에서 지움
function lookahead() {
  const uuids = [];
  for (let k = 0; k < G.list.length && uuids.length < LOOKAHEAD; k++)
    for (const p of G.list[(G.i + k) % G.list.length].photos)
      if (uuids.length < LOOKAHEAD) uuids.push(p.uuid);
  prefetch(uuids);
}

function move(d) {
  if (busy || !G.list.length) return;
  G.i = (G.i + d + G.list.length) % G.list.length;
  resetKeep();
  renderGroup();
  lookahead();
}

let busy = false;
async function confirmGroup() {
  if (busy || !G.list.length) return;
  busy = true;
  const g = G.list[G.i], idx = G.i;
  const btns = [...view.querySelectorAll("#ok, [data-g=ok]")];
  btns.forEach(b => { b.disabled = true; b.dataset.label = b.innerHTML; b.textContent = "확정 중…"; });
  const slow = setTimeout(() => showOk("Photos 응답을 기다리는 중… (Photos 앱이 바쁘면 몇 초 걸려요)"), 3000);
  const reject = g.photos.filter(p => !G.keep.has(p.uuid)).map(p => p.uuid);
  try {
    await post("mark", { group_id: g.id, reject });
    showErr(""); banner("#okmsg", "");
    G.list = G.list.filter(x => x.id !== g.id);  // 인덱스 아닌 id로 제거
    G.done++;
    G.i = Math.min(G.i, Math.max(0, G.list.length - 1));
    resetKeep();
    if (PV.open) pvClose();
    if (current === "groups") renderGroup();
    lookahead();
    refreshStats(); refreshCandidates();
    showUndo(g, idx, reject.length);
  } catch (e) {
    showErr("확정 실패: " + e.message);
    btns.forEach(b => { b.disabled = false; b.innerHTML = b.dataset.label; });  // 실패: 같은 묶음 그대로 → 버튼 복구
  } finally {
    clearTimeout(slow);
    busy = false;
  }
}

// 확정 직후 8초 동안 되돌리기 (잘못 누른 경우: 후보로 보낸 사진을 앨범에서 빼고 묶음을 다시 목록에)
let undoTimer = null;
function showUndo(g, idx, n) {
  const box = $("#undo");
  box.innerHTML = `확정됨 · ${n ? `✕ ${n}장 후보로` : "전부 남김"} <button>↩ 되돌리기</button>`;
  box.classList.add("show");
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => box.classList.remove("show"), 8000);
  box.querySelector("button").onclick = async () => {
    box.classList.remove("show");
    try {
      await post("unmark", { group_id: g.id });
      G.list.splice(Math.min(idx, G.list.length), 0, g);
      G.done = Math.max(0, G.done - 1);
      G.i = Math.min(idx, G.list.length - 1);
      resetKeep();
      if (current === "groups") renderGroup();
      showOk("되돌렸어요 — 묶음을 다시 정리할 수 있어요");
      refreshStats(); refreshCandidates();
    } catch (e) { showErr("되돌리기 실패: " + e.message); }
  };
}

async function showGroups() {
  G.list = await api("groups");
  G.i = 0;
  if (!G.start) G.start = G.list.length;
  resetKeep();
  renderGroup();
  lookahead();
}

// ── 용량 ───────────────────────────────────
async function showSize(kind = "all") {
  const [s, items] = await Promise.all([api("summary"), api("size?kind=" + kind)]);
  const years = Object.entries(s.by_year);
  const max = Math.max(1, ...years.map(([, v]) => v));
  const kinds = [["all", "전체"], ["photo", "사진"], ["movie", "영상"]];
  view.innerHTML = `
    <div class="bar"><span class="info">연도별 용량</span></div>
    <div class="years">${years.map(([y, v]) => `<div style="height:${(v / max) * 100}%" title="${y}: ${fmt(v)}"><span>${y}</span></div>`).join("")}</div>
    <div class="bar" style="margin-top:28px">
      <span class="info">큰 파일 상위 ${items.length}개 · ${fmt(items.reduce((a, p) => a + p.size, 0))} · 사진에 마우스 올리고 <kbd>Space</kbd> 크게 보기</span>
      ${kinds.map(([k, l]) => `<button data-k="${k}" class="${k === kind ? "on" : ""}">${l}</button>`).join("")}
    </div>
    <div class="grid">${items.map(p => tile(p.uuid, `${fmt(p.size)} · ${day(p.date)}${p.movie ? " · 🎬" : ""}`)).join("")}</div>`;
  view.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => showSize(b.dataset.k));
}

// ── 위치 ───────────────────────────────────
async function showPlaces() {
  const places = await api("places");
  view.innerHTML = `<div class="rows">${places.map((p, i) =>
    `<div class="row" data-i="${i}"><span class="grow">${esc(p.country)}${p.city ? " › " + esc(p.city) : ""}</span>` +
    `<span class="dim">${p.count.toLocaleString()}장</span><span class="dim">${fmt(p.size)}</span></div>`).join("")}</div>
    <div id="sub" style="margin-top:16px"></div>`;
  view.querySelectorAll(".row").forEach(r => r.onclick = () => {
    view.querySelectorAll(".row.on").forEach(x => x.classList.remove("on"));
    r.classList.add("on");
    $("#sub").innerHTML = thumbs(places[r.dataset.i].uuids);
    $("#sub").scrollIntoView({ behavior: "smooth" });
  });
}

// ── 여행 ───────────────────────────────────
async function showTrips() {
  const trips = await api("trips");
  if (!trips.length) { view.innerHTML = `<p class="empty">감지된 여행이 없습니다 (⚙️에서 기준 조절)</p>`; return; }
  view.innerHTML = `<div class="cards">${trips.map((t, i) =>
    `<div class="card" data-i="${i}"><b>${esc(t.name)}</b><span>${day(t.start)} ~ ${day(t.end)} · ${t.count}장 · ${fmt(t.size)}</span></div>`).join("")}</div>
    <div id="sub"></div>`;
  view.querySelectorAll(".card").forEach(c => c.onclick = () => {
    view.querySelectorAll(".card.on").forEach(x => x.classList.remove("on"));
    c.classList.add("on");
    $("#sub").innerHTML = thumbs(trips[c.dataset.i].uuids);
  });
}

// ── ⚙️ 추출 파라미터 ─────────────────────────
const KNOBS = [
  ["묶음 (비슷한 사진)"],
  ["hash_max", "유사도 허용치", 0, 40, 1, "", "↑ 느슨(포즈 많이 달라도 묶음) · ↓ 엄격(거의 똑같은 것만)"],
  ["gap_min", "연속 촬영 간격", 0.5, 60, 0.5, "분", "이 시간 안에 이어 찍어야 같은 묶음"],
  ["near_m", "같은 장소 거리", 10, 2000, 10, "m", "GPS가 이보다 멀면 다른 묶음"],
  ["min_group", "묶음 최소 장수", 2, 20, 1, "장", ""],
  ["여행"],
  ["trip_km", "집에서 거리", 10, 500, 10, "km", "모든 집에서 이만큼 떨어져야 여행"],
  ["min_trip", "여행 최소 장수", 1, 100, 1, "장", ""],
  ["home_days", "집 판정 촬영 일수", 5, 200, 5, "일", "서로 다른 날 이만큼 찍은 곳 = 집(여러 곳 가능)"],
];
let ST = null, stTimer = null;
function renderSettings() {
  const v = ST.values;
  $("#st").innerHTML = `<h3>⚙️ 추출 파라미터</h3>` + KNOBS.map(k => k.length === 1 ? `<div class="sec">${k[0]}</div>` :
    `<label><div class="row"><span>${k[1]}</span><b id="v_${k[0]}">${v[k[0]]}${k[5]}</b></div>
      <input type="range" data-k="${k[0]}" min="${k[2]}" max="${k[3]}" step="${k[4]}" value="${v[k[0]]}">
      ${k[6] ? `<div class="help">${k[6]}</div>` : ""}</label>`).join("") +
    `<div class="res" id="st_res">묶음 <b>${ST.groups}</b>개 · 여행 <b>${ST.trips}</b>개</div>
     <div class="bar" style="margin:10px 0 0"><span class="info"></span><button id="st_def">기본값으로</button><button id="st_close" class="primary">닫기</button></div>`;
  $("#st").querySelectorAll("input[type=range]").forEach(inp => inp.oninput = () => {
    const k = inp.dataset.k, knob = KNOBS.find(x => x[0] === k);
    $("#v_" + k).textContent = inp.value + knob[5];
    $("#st_res").textContent = "다시 계산 중…";
    clearTimeout(stTimer);
    stTimer = setTimeout(() => applySettings({ [k]: Number(inp.value) }), 250);
  });
  $("#st_def").onclick = () => applySettings(ST.defaults, true);
  $("#st_close").onclick = closeSettings;
}
async function applySettings(body, rerender = false) {
  try {
    ST = await post("settings", body);
    if (rerender) renderSettings();
    else $("#st_res").innerHTML = `묶음 <b>${ST.groups}</b>개 · 여행 <b>${ST.trips}</b>개`;
    refreshStats();
  } catch (e) { showErr("설정 실패: " + e.message); }
}
async function openSettings() { ST = await api("settings"); renderSettings(); $("#st").classList.add("open"); }
function closeSettings() { $("#st").classList.remove("open"); openTab(current); }  // 바뀐 기준으로 현재 탭 새로 그림
$("#stbtn").onclick = () => $("#st").classList.contains("open") ? closeSettings() : openSettings();

// ── 탭 / 키보드 ─────────────────────────────
// ── 📷 전체: 묶음 밖 사진도 빠르게 골라 후보로 ─────────────
const FL = [["all", "전체"], ["screenshot", "📱 스크린샷"], ["fail", "😵 실패작"], ["burst", "💥 연사 나머지"], ["movie", "🎬 영상"], ["old", "오래된 순"]];
const BY_MONTH = ["all", "old", "screenshot", "burst"];  // 날짜순 필터만 월별 제목
const A = { filter: "all", offset: 0, total: 0, sel: new Set(), sizes: {}, loading: false };
async function showAll(filter = A.filter) {
  if (filter !== A.filter) A.sel.clear();
  Object.assign(A, { filter, offset: 0, total: 0, loading: false });
  const f = await api("filters");
  view.innerHTML = `
    <div class="bar chips">${FL.filter(([k]) => k === "all" || f[k].count).map(([k, l]) =>
      `<button data-f="${k}" class="${k === filter ? "on" : ""}">${l} ${f[k].count.toLocaleString()} · ${fmt(f[k].size)}</button>`).join("")}</div>
    <p class="hint">탭·클릭 = 선택 ✕ · 길게 누르기(마우스: 올리고 <kbd>Space</kbd>) = 크게 보기 · 월 제목 버튼 = 그 달 전부 선택/해제 · 고른 사진은 아래 버튼으로 삭제 후보에</p>
    <div id="allgrid"></div><div id="more"></div><div style="height:90px"></div>
    <div class="gbar"><button data-a2="selall">이 필터 전부 선택</button><button data-a2="clear">선택 해제</button>
      <button data-a2="send" class="primary"></button></div>`;
  view.querySelectorAll("[data-f]").forEach(b => b.onclick = () => showAll(b.dataset.f));
  view.querySelectorAll("[data-a2]").forEach(b => b.onclick = () => allAction(b.dataset.a2));
  $("#allgrid").onclick = e => {
    const t = e.target.closest(".tile");
    if (t) toggleSel(t.dataset.uuid);
    else if (e.target.dataset.m) selectMonth(e.target.dataset.m);
  };
  await loadMore();
  updateSel();
}
async function loadMore() {
  if (A.loading || (A.offset && A.offset >= A.total)) return;
  A.loading = true;
  try {
    const r = await api(`all?filter=${A.filter}&offset=${A.offset}&limit=300`);
    A.total = r.total; A.offset += r.items.length;
    const box = $("#allgrid");
    if (!box) return;
    for (const p of r.items) {
      A.sizes[p.uuid] = p.size;
      const m = BY_MONTH.includes(A.filter) ? p.date.slice(0, 7) : "x";
      let grid = box.querySelector(`.grid[data-m="${m}"]`);
      if (!grid) {
        box.insertAdjacentHTML("beforeend", (m === "x" ? "" : `<h3 class="month">${m.replace("-", "년 ")}월 <button data-m="${m}">이 달 전부 선택</button></h3>`) +
          `<div class="grid" data-m="${m}"></div>`);
        grid = box.lastElementChild;
      }
      grid.insertAdjacentHTML("beforeend", tile(p.uuid, fmt(p.size) + (p.movie ? " · 🎬" : ""), A.sel.has(p.uuid) ? "drop" : ""));
    }
    const more = $("#more");
    more.innerHTML = A.offset < A.total ? `<button id="moreBtn">더 보기 (${(A.total - A.offset).toLocaleString()}장 남음)</button>` : "";
    if ($("#moreBtn")) {
      $("#moreBtn").onclick = loadMore;
      new IntersectionObserver((es, ob) => { if (es[0].isIntersecting) { ob.disconnect(); loadMore(); } }).observe($("#moreBtn"));  // 스크롤하면 자동으로 이어서
    }
  } finally { A.loading = false; }
}
function markSel(u) { view.querySelectorAll(`.tile[data-uuid="${CSS.escape(u)}"]`).forEach(t => t.classList.toggle("drop", A.sel.has(u))); }
function toggleSel(u) { A.sel.has(u) ? A.sel.delete(u) : A.sel.add(u); markSel(u); updateSel(); }
function selectMonth(m) {
  const us = [...view.querySelectorAll(`.grid[data-m="${m}"] .tile`)].map(t => t.dataset.uuid).filter(u => !CAND.has(u));
  const all = us.every(u => A.sel.has(u));
  us.forEach(u => { all ? A.sel.delete(u) : A.sel.add(u); markSel(u); });
  updateSel();
}
function updateSel() {
  const b = view.querySelector("[data-a2=send]");
  if (!b) return;
  const known = [...A.sel].filter(u => u in A.sizes);
  b.disabled = !A.sel.size;
  b.textContent = `✕ ${A.sel.size.toLocaleString()}장 후보로 (${fmt(known.reduce((s, u) => s + A.sizes[u], 0))}${known.length < A.sel.size ? "+" : ""})`;
}
async function allAction(a) {
  if (a === "clear") { const was = [...A.sel]; A.sel.clear(); was.forEach(markSel); return updateSel(); }
  if (a === "selall") {
    const r = await api(`all?filter=${A.filter}&limit=1&ids=1`);
    r.uuids.filter(u => !CAND.has(u)).forEach(u => A.sel.add(u));
    view.querySelectorAll(".grid .tile").forEach(t => markSel(t.dataset.uuid));
    return updateSel();
  }
  if (a === "send" && A.sel.size) {
    const b = view.querySelector("[data-a2=send]"), us = [...A.sel];
    b.disabled = true; b.textContent = `보내는 중… (${us.length.toLocaleString()}장)`;
    try {
      await post("candidate", { uuids: us });
      us.forEach(u => { CAND.add(u); A.sel.delete(u); view.querySelectorAll(`.tile[data-uuid="${CSS.escape(u)}"]`).forEach(t => { t.classList.remove("drop"); t.classList.add("cand"); }); });
      showOk(`✕ ${us.length.toLocaleString()}장을 삭제 후보로 보냄 — 🗑 후보 탭에서 확인 후 삭제`);
      refreshCandidates();
    } catch (e) { showErr("후보 보내기 실패: " + e.message); }
    updateSel();
  }
}

// ── 영상: 큰 순, 장면 미리보기(Mac에 있음)를 펼쳐 원본 없이 내용 확인 → 탭으로 선택 ─────
const V = { offset: 0, total: 0, sel: new Set(), sizes: {}, loading: false, list: [] };
async function showVideos() {
  Object.assign(V, { offset: 0, total: 0, loading: false, list: [] });
  view.innerHTML = `
    <div class="bar"><span class="info" id="vinfo"></span></div>
    <p class="hint">왼쪽(크기·날짜) 탭 = 선택 ✕ · 장면 줄 탭 = 크게 보기(▶ 재생 가능) · 큰 영상부터 정리하면 공간이 가장 많이 생겨요</p>
    <div id="vlist"></div><div id="vmore"></div><div style="height:90px"></div>
    <div class="gbar"><button data-v="clear">선택 해제</button><button data-v="send" class="primary"></button></div>`;
  view.querySelectorAll("[data-v]").forEach(b => b.onclick = () => videoAction(b.dataset.v));
  $("#vlist").onclick = e => {
    const row = e.target.closest(".vrow");
    if (!row) return;
    const u = row.dataset.uuid;
    if (e.target.closest(".vstrip")) return pvOpen(V.list, V.list.indexOf(u));
    if (CAND.has(u)) return;
    V.sel.has(u) ? V.sel.delete(u) : V.sel.add(u);
    row.classList.toggle("sel", V.sel.has(u));
    row.querySelector(".vstate").textContent = V.sel.has(u) ? "✕ 선택됨" : "탭해서 선택";
    updateVSel();
  };
  await loadVideos();
  updateVSel();
}
async function loadVideos() {
  if (V.loading || (V.offset && V.offset >= V.total)) return;
  V.loading = true;
  try {
    const r = await api(`videos?offset=${V.offset}&limit=40`);
    V.total = r.total; V.offset += r.items.length;
    const box = $("#vlist");
    if (!box) return;
    $("#vinfo").innerHTML = `<span class="gnum">영상 ${r.total.toLocaleString()}개</span><span class="meta">${fmt(r.size)} · 큰 것부터</span>`;
    for (const p of r.items) {
      V.sizes[p.uuid] = p.size; V.list.push(p.uuid);
      const u = encodeURIComponent(p.uuid), c = CAND.has(p.uuid), s = V.sel.has(p.uuid);
      const strip = p.frames ? Array.from({ length: p.frames }, (_, i) => `<img loading="lazy" draggable="false" src="/frame/${u}/${i}">`).join("")
                             : `<img loading="lazy" draggable="false" src="/thumb/${u}"><span class="nof">장면 미리보기 없음 — 탭해서 크게 보기</span>`;
      box.insertAdjacentHTML("beforeend", `<div class="vrow${s ? " sel" : ""}${c ? " cand" : ""}" data-uuid="${esc(p.uuid)}">
        <div class="vinfo"><b>${fmt(p.size)}</b><span>${day(p.date)}${p.city ? " · " + esc(p.city) : ""}</span>
          <span class="vstate">${c ? "🗑 후보" : s ? "✕ 선택됨" : "탭해서 선택"}</span></div>
        <div class="vstrip">${strip}</div></div>`);
    }
    const more = $("#vmore");
    more.innerHTML = V.offset < V.total ? `<button id="vmoreBtn">더 보기 (${(V.total - V.offset).toLocaleString()}개 남음)</button>` : "";
    if ($("#vmoreBtn")) {
      $("#vmoreBtn").onclick = loadVideos;
      new IntersectionObserver((es, ob) => { if (es[0].isIntersecting) { ob.disconnect(); loadVideos(); } }).observe($("#vmoreBtn"));
    }
  } finally { V.loading = false; }
}
function updateVSel() {
  const b = view.querySelector("[data-v=send]");
  if (!b) return;
  b.disabled = !V.sel.size;
  b.textContent = `✕ ${V.sel.size}개 후보로 (${fmt([...V.sel].reduce((a, u) => a + (V.sizes[u] || 0), 0))})`;
}
async function videoAction(a) {
  if (a === "clear") {
    V.sel.clear();
    view.querySelectorAll(".vrow.sel").forEach(r => { r.classList.remove("sel"); r.querySelector(".vstate").textContent = "탭해서 선택"; });
    return updateVSel();
  }
  if (a !== "send" || !V.sel.size) return;
  const b = view.querySelector("[data-v=send]"), us = [...V.sel], size = us.reduce((s, u) => s + (V.sizes[u] || 0), 0);
  b.disabled = true; b.textContent = `보내는 중… (${us.length}개)`;
  try {
    await post("candidate", { uuids: us });
    us.forEach(u => {
      CAND.add(u); V.sel.delete(u);
      view.querySelectorAll(`.vrow[data-uuid="${CSS.escape(u)}"]`).forEach(r => { r.classList.remove("sel"); r.classList.add("cand"); r.querySelector(".vstate").textContent = "🗑 후보"; });
    });
    showOk(`✕ 영상 ${us.length}개 (${fmt(size)})를 후보로 — 🗑 후보 탭에서 확인 후 삭제`);
    refreshCandidates();
  } catch (e) { showErr("후보 보내기 실패: " + e.message); }
  updateVSel();
}

// ── 삭제 후보 ────────────────────────────────
async function showCands() {
  const c = await api("candidates");
  CAND = new Set(c.uuids);
  if (!c.count) { view.innerHTML = `<p class="empty">삭제 후보가 없습니다</p>`; return; }
  view.innerHTML = `
    <div class="bar"><span class="info">삭제 후보 ${c.count}장 · ${fmt(c.size)} — 지우기 전에 한 번 더 확인</span>
      <button id="candDel" class="danger">🗑 전부 삭제 (Mac에서 승인)</button></div>
    <p class="hint">사진 탭 = 크게 보기(↩ 후보에서 빼기 버튼) · 모서리 <b>↩</b> = 바로 후보에서 빼기 (사진은 그대로) ·
      삭제한 사진은 Photos '최근 삭제된 항목'에 30일 남아 iCloud 공간을 차지 — 바로 확보하려면 거기서 비우기</p>
    <div class="grid">${c.items.map(p => tile(p.uuid, fmt(p.size) + (p.movie ? " · 🎬" : ""))
      .replace('<span class="badge"></span>', '<button class="undo" title="후보에서 빼기">↩</button>')).join("")}</div>`;
  $("#candDel").onclick = () => $("#delbtn").click();
  view.querySelectorAll(".tile .undo").forEach(b => b.onclick = e => { e.stopPropagation(); removeCandidate(b.closest(".tile").dataset.uuid); });
}

const tabs = { groups: showGroups, all: () => showAll(), videos: showVideos, size: () => showSize(), places: showPlaces, trips: showTrips, cands: showCands };
let current = "groups";
async function openTab(tab) {
  current = tab;
  document.querySelectorAll("nav button[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  view.innerHTML = `<p class="empty">불러오는 중…</p>`;
  try { await tabs[tab](); } catch (e) { showErr(e.message); }
}
document.querySelectorAll("nav button[data-tab]").forEach(b => b.onclick = () => openTab(b.dataset.tab));

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "INPUT") return;
  const k = e.code;  // e.code → 한글 입력 상태에서도 X 동작
  if (PV.open) {
    if (k === "Space" || k === "Escape") { e.preventDefault(); pvClose(); }
    else if (k === "ArrowLeft") { e.preventDefault(); pvMove(-1); }
    else if (k === "ArrowRight") { e.preventDefault(); pvMove(1); }
    else if (k === "KeyX" && PV.keepSet && !e.repeat) toggleKeep(PV.list[PV.i]);
    return;
  }
  if (k === "Escape" && $("#st").classList.contains("open")) return closeSettings();
  if (current !== "groups") {
    if (k === "Space" && pvFromHover()) e.preventDefault();
    return;
  }
  if (e.repeat && (k === "Enter" || k === "KeyX")) return;  // 키 누르고 있기 → 연속 확정 방지
  const g = G.list[G.i];
  if (k === "ArrowLeft") { e.preventDefault(); setCursor(G.cur - 1); }
  else if (k === "ArrowRight") { e.preventDefault(); setCursor(G.cur + 1); }
  else if (k === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (k === "ArrowDown") { e.preventDefault(); move(1); }
  else if (k === "Space") { e.preventDefault(); openGroupPreview(); }
  else if (k === "KeyX" && g) toggleKeep(g.photos[G.cur].uuid);
  else if (k === "Enter") { e.preventDefault(); confirmGroup(); }
});
$("#reloadbtn").onclick = async () => {
  const b = $("#reloadbtn"); b.disabled = true; b.textContent = "…";
  try {
    const r = await post("reload", {});
    showOk(`라이브러리 다시 읽음: 사진 ${r.count.toLocaleString()}장`);
    await Promise.all([refreshStats(), refreshCandidates()]);
    openTab(current);
  } catch (e) { showErr("새로고침 실패: " + e.message); }
  finally { b.disabled = false; b.textContent = "⟳"; }
};
refreshStats().catch(e => showErr(e.message));
refreshCandidates();
openTab("groups");
</script>
